name: Update Vrbo availability

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Refresh the published availability data
        env:
          ICAL_URL: ${{ secrets.VRBO_ICAL_URL }}
        run: node scripts/update-availability.mjs
      - name: Commit updated availability if changed
        run: |
          git diff --quiet availability.json || {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add availability.json
            git commit -m 'Update Vrbo availability'
            git push
          }
